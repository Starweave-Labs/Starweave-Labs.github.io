  <title id="title">星织实验室 · Starweave Labs — 汇聚灵感，共织作品。</title>
  <desc id="description">午夜墨色底上的中文标题：让灵感相遇，让作品生长。右侧薄荷色镂空四角星与细线星图，代表灵感、设计与代码的交织。</desc>
